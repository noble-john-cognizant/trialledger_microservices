<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="fw-bold mb-0">Notifications</h2>
  <button class="btn btn-outline-primary btn-sm" (click)="markAll()" [disabled]="unreadCount() === 0">
    Mark all read
  </button>
</div>

<div class="card">
  <div class="card-body p-0">
    @if (loading() && list().length === 0) {
      <div class="p-4"><tl-spinner block label="Loading…" /></div>
    } @else if (list().length === 0) {
      <div class="text-center text-muted py-4">No notifications.</div>
    } @else {
      <ul class="list-group list-group-flush">
        @for (n of list(); track n.notificationId) {
          <li class="list-group-item notif" [class.unread]="n.status === 'UNREAD'"
              (click)="markRead(n)">
            <div>{{ n.message }}</div>
            <small class="text-muted">{{ n.category }} · {{ n.createdAt | date:'short' }}</small>
          </li>
        }
      </ul>
    }
  </div>
</div>
