<tl-toasts />
<div class="auth-shell">
  <aside class="auth-hero d-none d-lg-flex flex-column justify-content-between">
    <div>
      <div class="brand d-flex align-items-center gap-2">
        <span class="brand-logo">TL</span><span class="fs-4 fw-bold">TrialLedger</span>
      </div>
      <h1 class="mt-5 fw-bold">Reset your password.</h1>
      <p class="lead opacity-75">Enter the email you registered with and choose a new password.</p>
    </div>
  </aside>

  <section class="auth-form">
    <div class="auth-card">
      <h2 class="fw-bold mb-1">Forgot password</h2>
      <p class="text-muted mb-4">We will overwrite the password for the matching account.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email">
        </div>
        <div class="mb-3">
          <label class="form-label">New password</label>
          <input type="password" class="form-control" formControlName="newPassword">
        </div>
        <button class="btn btn-primary w-100" type="submit" [disabled]="form.invalid || loading()">
          @if (loading()) { <span class="spinner-border spinner-border-sm me-2"></span> Updating… }
          @else { Reset password }
        </button>
      </form>

      <div class="text-center mt-4 small">
        <a routerLink="/login">← Back to sign in</a>
      </div>
    </div>
  </section>
</div>
