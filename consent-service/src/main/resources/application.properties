# ===============================

# ? SERVER CONFIG

# ===============================

server.port=8013

spring.application.name=CONSENT-SERVICE

# ===============================

# ?? DATABASE CONFIG (MySQL)

# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/consent_db

spring.datasource.username=root

spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================

# ? JPA / HIBERNATE CONFIG

# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================

# ? EUREKA CLIENT CONFIG

# ===============================

eureka.client.service-url.defaultZone=http://localhost:8762/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

# Optional (for hostname display)

eureka.instance.hostname=localhost

# ===============================

# ? LOGGING (Optional)

# ===============================

logging.level.org.springframework=INFO

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always

resilience4j.circuitbreaker.instances.studyService.failureRateThreshold=50

resilience4j.circuitbreaker.instances.studyService.slidingWindowSize=5

resilience4j.circuitbreaker.instances.protocolService.failureRateThreshold=50

resilience4j.circuitbreaker.instances.protocolService.slidingWindowSize=5