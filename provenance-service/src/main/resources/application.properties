spring.application.name=PROVENANCE-SERVICE
server.port=9191

EXTERNAL_STORAGE_PATH=C:\microservice-mini-project-storage

spring.datasource.url=jdbc:mysql://localhost:3306/provenance_service_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# ============================================================
# Resilience4j Circuit Breaker + Retry Configuration
# ============================================================

# Enable Spring Cloud OpenFeign + Resilience4j integration
spring.cloud.openfeign.circuitbreaker.enabled=true

# Default circuit breaker config - applies to all Feign clients unless overridden
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

# Default retry config
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.configs.default.retry-exceptions=feign.RetryableException,java.io.IOException,java.util.concurrent.TimeoutException

# Expose actuator endpoints for circuit breaker monitoring
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
