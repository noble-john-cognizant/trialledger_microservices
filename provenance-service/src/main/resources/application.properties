spring.application.name=PROVENANCE-SERVICE
server.port=9191

EXTERNAL_STORAGE_PATH=C:\\microservice-mini-project-storage

spring.datasource.url=jdbc:mysql://localhost:3306/provenance_db
spring.datasource.username=root
spring.datasource.password=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===========================================================================
#  CIRCUIT BREAKER  (Resilience4j + Spring Cloud OpenFeign integration)
# ---------------------------------------------------------------------------
#  Provenance-service aggregates data from four downstream services to build
#  dataset snapshots and audit packages. If any of them are slow or down we
#  must fail fast instead of hanging the snapshot generation.
#  When the failure rate over the sliding window crosses the threshold the
#  CB opens, all subsequent calls return the fallback immediately (no network
#  hit), and after a wait period the CB enters HALF_OPEN to probe recovery.
# ===========================================================================

# Turn on Feign <-> Resilience4j wiring.
spring.cloud.openfeign.circuitbreaker.enabled=true
# Group all methods of a single Feign client under one CB named after the
# client (CONSENT-SERVICE, SAMPLE-SERVICE, ...). Without this, Spring Cloud
# creates a separate CB per method signature which wouldn't match the
# resilience4j.circuitbreaker.instances.<NAME> config below.
spring.cloud.openfeign.circuitbreaker.group.enabled=true

# Resilience4j default configuration — inherited by every named instance below.
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.recordExceptions=feign.FeignException,java.io.IOException,java.util.concurrent.TimeoutException

# One CB instance per Feign client. The instance name MUST match the Feign
# client name (the `name` attribute on @FeignClient) because Spring Cloud
# auto-creates a CB with that exact key when feign.circuitbreaker.enabled=true.
resilience4j.circuitbreaker.instances.CONSENT-SERVICE.baseConfig=default
resilience4j.circuitbreaker.instances.SAMPLE-SERVICE.baseConfig=default
resilience4j.circuitbreaker.instances.VISIT-SERVICE.baseConfig=default
resilience4j.circuitbreaker.instances.ADVERSE-EVENT-SERVICE.baseConfig=default

# Time-limit each downstream call so a slow service can't hang snapshot generation.
resilience4j.timelimiter.configs.default.timeoutDuration=5s
resilience4j.timelimiter.configs.default.cancelRunningFuture=true
resilience4j.timelimiter.instances.CONSENT-SERVICE.baseConfig=default
resilience4j.timelimiter.instances.SAMPLE-SERVICE.baseConfig=default
resilience4j.timelimiter.instances.VISIT-SERVICE.baseConfig=default
resilience4j.timelimiter.instances.ADVERSE-EVENT-SERVICE.baseConfig=default

# ===========================================================================
#  ACTUATOR  — expose CB state for monitoring
# ---------------------------------------------------------------------------
#   GET /actuator/health            -> aggregated health, includes each CB
#   GET /actuator/circuitbreakers   -> list & current state of every CB
#   GET /actuator/circuitbreakerevents/<name>?eventType=...
# ===========================================================================
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
